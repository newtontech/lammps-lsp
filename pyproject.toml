[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "lammps-lsp"
version = "0.1.0rc1"
description = "Language Server Protocol and agent CLI for LAMMPS input scripts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-only" }
authors = [{ name = "lammps-lsp contributors" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
include = [
    { path = "skill/skill.yaml", format = ["sdist"] },
    { path = "skill/SKILL.md", format = ["sdist"] },
    { path = "skill/references/README.md", format = ["sdist"] },
]
